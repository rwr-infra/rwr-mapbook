[project]
site_url = "https://bananaxiao2333.github.io/rwr-mapbook/"
site_name = "RWR 地编手册"
site_description = "小兵步枪（Running With Rifles）地图编辑器手册：地编界面逐项说明、模型与墙体清单、交互按键与常用流程。"
site_author = "RWR 地图编辑组"

copyright = "RWR 地编手册 · 由 RWR 地图编辑组维护"

# 仓库入口（可选）：填了 repo_url，页眉搜索框旁就会出现一个「图标 + 仓库名」的链接
# （见 overrides/partials/header.html 末尾那段判断，以及主题的 partials/source.html）。
#
# ⚠️ Zensical 对公开的 GitHub 仓库会自动去 api.github.com 取 star / fork / 最新
# release 数并渲染在图标旁——那是每个访客一次第三方请求。本模版默认把这一项在
# 同意表单里显式关掉（见下面 [project.extra.consent.cookies]），以维持
# 「本模版默认不发起任何第三方请求」的姿势。要显示计数就删掉那里的一行。
#
# 不设 repo_name 时 Zensical 拿 URL 的域名推断，页眉那行字只剩「GitHub」；
# 写上仓库名读者才知道点进去是哪儿。
repo_url = "https://github.com/bananaxiao2333/rwr-mapbook"
repo_name = "rwr-mapbook"


# extra_css / extra_javascript 必须在任何 [[project.*]] 表之前，
# 否则会被 TOML 归入该表，导致 project.extra_css 为空。
# glightbox 的自有副本排在最前，好让 extra.css 里的覆盖仍然压得住它。
extra_css = [
  "stylesheets/glightbox.min.css",
  "stylesheets/fonts.css",
  "stylesheets/extra.css",
]
# 原则：本站不引任何外部脚本或字体，全部自托管。
# 原先这里挂了 unpkg 上的 MathJax，但站内没有一篇用到数学，
# 却让每个访客在每次浏览时都向 unpkg 暴露一次 IP —— 与「数据隐私」页的
# 声明直接冲突，故整个移除（见 docs/stylesheets/fonts.css 的同类说明）。
#
# 同样的账，图片灯箱也欠着：glightbox 插件在点开图片时默认从 unpkg 取
# glightbox.min.js 与 .css（见 zensical/templates 里 bundle 的 Wp()/Dp()）。
# 也就是说「脚本全部由本站自托管」这句话，此前在图片页上是不成立的。
# 下面挂的是这两个文件的**本站副本**：bundle 里那两处都在下载前先看
# typeof GLightbox，只要它已经存在就跳过网络请求、直接用现成的全局对象。
# extra_javascript 在 bundle 之后、document$ 初始化之前执行，
# 所以灯箱初始化时这个全局已经就位，无需改动主题。
# ⚠️ 升级 glightbox 插件版本时要同步换掉这两个文件。
#
# search-lang.js 是本站自己的：搜索索引全站只有一份，筛选栏里的标签因此是
# 三种语言混在一个列表里的。这个脚本把标签**按语言分段**（当前页面的语言排最前），
# 并把面板上写死的英文换成页面语言的词。它得挂进主题搜索面板的 shadow root，
# 原理与「升级时要跟着看」的提醒都写在那个文件的头部。
#
# downloads.js 也是本站自己的：历史版本归档超过托管方允许的单文件上限，
# 在仓库里是一堆分片，这个脚本把分片取回来、校验、拼成一个整文件再存下去
# （分片由 tools/chunker.py 切出来，清单在 docs/downloads/ 下）。
# 页面上没有下载按钮时它什么都不做。
extra_javascript = [
  "javascripts/glightbox.min.js",
  "javascripts/search-lang.js",
  "javascripts/redact.js",
  "javascripts/downloads.js",
]

# 链接与锚点校验：构建时就把断链/失效锚点报出来，而不是等读者点到。
# Zensical 只支持链接相关的这几项（导航类的会被忽略）。
[project.validation]
invalid_links = true
invalid_link_anchors = true

# 分语种的外观文案。
# Zensical 的 site_name / copyright 是全站唯一的，而本站中英共用一次构建，
# 所以英文站名与版权行放在这里，由模板按页面语言取用
# （见 overrides/partials/header.html、footer.html、main.html）。
# ⚠️ 同样必须在 [[project.extra.alternate]] 之前，否则会被归入该表。
# 键名后缀：默认语言（zh-hans）留空，其余语言用 _en / _zh_hant。
# 模板里用 `config.extra["site_name" ~ L]` 取用，L 由页面语言决定。
[project.extra]
# 站名的另一种写法。**不在页面上显示**——页眉只留站名一行。
# 仅用于结构化数据里的 alternateName（见 overrides/main.html 的 JSON-LD），
# 让检索端把默认语言站名与译文站名认成同一个实体。
# 这个键通常三语同形，故不做分语种。
site_subtitle = "RWR 地编手册"

site_name_en = "RWR Map Editor's Handbook"
copyright_en = "RWR Map Editor's Handbook · maintained by the RWR map-editing group"
site_author_en = "RWR Map Editing Group"
consent_title_en = "Data & privacy"
consent_description_en = "This site collects no visitor data. There is no analytics, no advertising, no cookie and no third-party request of any kind. Fonts, styles and scripts are all self-hosted, so any page contacts this site’s domain only. A single light/dark display preference is stored locally by the browser, and is removed when browser data is cleared."

consent_title_zh_hant = "資料隱私"
consent_description_zh_hant = "本站不收集任何存取資料：無統計、無廣告，亦不設定 cookie 或發起任何第三方請求。字型、樣式與腳本均由本站自行託管，存取任何頁面只連接本站一個網域。瀏覽器本機僅儲存一項深淺色顯示偏好，清除瀏覽器資料後即被移除。"

# 页面包屑的根（默认语言的根标签，例如「首页」）
nav_root_label_en = "Home"
site_description_en = "The handbook for the Running With Rifles map editor: what every panel does, the model and wall inventories, key bindings and common workflows."
# 主题切换按钮的提示文案（config.theme.palette 里的 toggle.name 是全站唯一的）
palette_toggle_auto_en = "Toggle light/dark"
palette_toggle_light_en = "Switch to dark"
palette_toggle_dark_en = "Switch to light"

# 繁体（zh-hant）。键名后缀用下划线，因为语言代码里本来就有连字符。
# 站名、版权、作者若与默认语言同形（如均为中文），该键可以省略、回落到默认值。
copyright_zh_hant = "RWR 地編手冊 · 由 RWR 地圖編輯組維護"
site_author_zh_hant = "RWR 地圖編輯組"
site_description_zh_hant = "小兵步槍（Running With Rifles）地圖編輯器手冊：地編介面逐項說明、模型與牆體清單、互動按鍵與常用流程。"
nav_root_label_zh_hant = "首頁"
palette_toggle_auto_zh_hant = "切換深淺色"
palette_toggle_light_zh_hant = "切換到深色"
palette_toggle_dark_zh_hant = "切換到淺色"

# ── 页脚品牌区的自由文案（见 overrides/partials/footer.html）──────────────
# 三段都是可选的：不填就不渲染那一段。键名后缀规则与上面完全一样。
footer_tagline = "有人试过，才写下来。"
footer_tagline_en = "Written down because someone tried it."
footer_tagline_zh_hant = "有人試過，才寫下來。"

footer_note = "由 Zensical 构建<br>字体与脚本全部自托管"
footer_note_en = "Built with Zensical<br>Fonts and scripts are entirely self-hosted"
footer_note_zh_hant = "由 Zensical 構建<br>字型與腳本全部自託管"

# 页脚底栏的三段固定 UI 文案。以前是模板里的三支判断（is_en / is_hant / 否则），
# 加一种语言要回去补三处，漏了也不报错（页面照常出，只是静静退回默认语言的
# 文案）——所以挪到这里，模板只按后缀取。
# 「按标签浏览」是页脚那个回标签索引的链接文字。
footer_browse_tags = "按标签浏览 ↗"
footer_browse_tags_en = "Browse by tag ↗"
footer_browse_tags_zh_hant = "依標籤瀏覽 ↗"

# 「隐私设置」指向 #__consent，也就是那份数据隐私说明（见 consent 一节）。
footer_privacy = "隐私设置"
footer_privacy_en = "Privacy settings"
footer_privacy_zh_hant = "隱私設定"

# 「回到顶部」也就是回 #top。
footer_back_top = "回到顶部 ↑"
footer_back_top_en = "Back to top ↑"
footer_back_top_zh_hant = "回到頂部 ↑"

# 同意表单「接受」按钮的文字（主题键名是 consent.accept，见 partials/language.html）。
# 表单原意是让人选第三方 cookie，但本站没有任何可选项（见下面的 consent 一节），
# 对一个只是把话说清楚的说明框，「同意」在语义上是错的——所以这里换成公告体里
# 表示「已阅知」的说法，不用「知道了」这类口语答复。
consent_accept = "我已知悉"
consent_accept_en = "Acknowledged"
consent_accept_zh_hant = "我已知悉"

# ── 主题界面文案包 ────────────────────────────────────────────────────────
# 主题自带的界面文案包是 partials/languages/<包名>.html，包名**不等于**语言代码：
# 简体那一包叫 `zh`（不是 `zh-Hans`），繁体 `zh-Hant`、英文 `en`。
# 因此这一项**无法从 alternate 的 lang 派生**，只能由配置给出（见
# overrides/partials/route.html 的 pack 宏：MiniJinja 的 import 没有
# `ignore missing`，模板里也问不到「这个模板存在吗」，硬拼只会在构建期报错）。
# ⚠️ 主题那几包是「自动生成、不要手改」的上游产物，这里只存包名、不存内容；
#    加语言时若主题没有与之同名的包，就补一条 `_<lang>` 指向最接近的那包。
lang_pack = "zh"
lang_pack_en = "en"
lang_pack_zh_hant = "zh-Hant"

# ── 搜索面板的文案 ────────────────────────────────────────────────────────
# 主题的搜索面板（`search.json` 那一套）文案是**写死英文**的，没有多语言入口。
# 这几个词由 overrides/main.html 按页面语言取出来交给
# docs/javascripts/search-lang.js 换上去，加语言时照着加一行 `_<lang>` 即可
# ——那边不再有自己的文案表。
search_text = "搜索"
search_text_en = "Search"
search_text_zh_hant = "搜尋"

search_filters = "筛选"
search_filters_en = "Filters"
search_filters_zh_hant = "篩選"

search_results = "条结果"
search_results_en = "results"
search_results_zh_hant = "條結果"

search_close = "关闭搜索"
search_close_en = "Close search"
search_close_zh_hant = "關閉搜尋"

search_filter_by_tag = "按标签筛选"
search_filter_by_tag_en = "Filter by tag"
search_filter_by_tag_zh_hant = "依標籤篩選"

# ── 历史版本归档：下载时那几行动态文字 ────────────────────────────────────
# 与 search_* 同一套办法：由 overrides/main.html 按页面语言取好，交给
# docs/javascripts/downloads.js 显示。脚本里没有自己的文案表，加语言照着加
# 一组 `_<lang>` 就行。
#
# 大小不在这里：它从 docs/downloads/manifest.json 里算出来（见 tools/chunker.py），
# 在配置里再写一份就等着过期。`{name}` 是文件名，不翻译。
download_progress = "正在取第 {n}/{m} 段…"
download_progress_en = "Fetching part {n} of {m}…"
download_progress_zh_hant = "正在取第 {n}/{m} 段…"

download_verify = "校验中…"
download_verify_en = "Verifying…"
download_verify_zh_hant = "校驗中…"

download_done = "校验通过，已保存 {name}"
download_done_en = "Verified — saved as {name}"
download_done_zh_hant = "校驗通過，已儲存 {name}"

download_unchecked = "已拼接保存为 {name}（当前环境不支持校验）"
download_unchecked_en = "Merged and saved as {name} (verification unavailable here)"
download_unchecked_zh_hant = "已拼接儲存為 {name}（目前環境不支援校驗）"

download_failed = "下载失败，原因见浏览器控制台"
download_failed_en = "Download failed — see the browser console"
download_failed_zh_hant = "下載失敗，原因見瀏覽器主控台"

footer_bottom = "RWR 地图编辑器手册"
footer_bottom_en = "RWR MAP EDITOR'S HANDBOOK"
footer_bottom_zh_hant = "RWR 地圖編輯器手冊"
# ── 语种补齐进度 ──────────────────────────────────────────────────────────
# ⚠️ 这是一处**刻意放宽**，改的是 tools/i18n_check.py 的判据，理由写在那里：
#    「还没翻」是看得见的（那页就是没有），「翻了但原文改了」才是看不见的。
#    本检查器存在的理由始终是后者，所以这里只放宽前者——
#    名单里的语种，它的「缺篇目 / 还是占位 / 刚建骨架」只统计、不挡构建；
#    「已过期 / 派生失同步 / 未记录指纹 / 结构待核」**照样挡**。
#
# 补完一个语种就把它从这张名单里删掉，判据立刻回到全严（一个字都不用改代码）。
# 名单为空或整条删掉，就是「所有语种都要求翻完」。
#
# 2026-09-25：英文全量译完，"en" 已摘出去，判据现在是全严的。
# 留一条空名单而不是删行，是给下一次「先上线、后补齐」留个现成口子：
# 往里加个语种就行，不必回来读这段注释。
translation_in_progress = []

# 切换器的无障碍标签。版本切换器是本站独有的（overrides/partials/version.html），
# 主题没有对应原版，所以这三条文案也由本站自己给。
version_aria = "切换地编版本"
version_aria_en = "Switch editor version"
version_aria_zh_hant = "切換地編版本"

# ── 版本清单 ──────────────────────────────────────────────────────────────
# 本站的第二条切换轴。读者装的是哪一版地编，就该看到哪一版的说明。
#
# ⚠️ 这张表是版本清单的**唯一出处**（tools/versions.py 读它），而 content/ 里
#    有没有对应的内容目录由 tools/versions.py 的 audit() 对齐：声明了没有目录、
#    或有目录没声明，都以非零码退出。不会静默分成两家账。
#
# 标记规则：标了 current = true 的那一条是**当前版**，它的内容就在 content/ 根下，
# 网址没有前缀（`/`）；其余各条在 content/versions/<id>/ 下，网址带前缀（`/egg/`）。
# 当前版必须**恰好一个**。
#
# 顺序就是切换器里的顺序——最新的排在最前。这里不排序：版本号不是都能比大小的，
# `vao0822` 与 `0101` 谁大只有作者知道。
#
# ⚠️ 版本是「冻结快照」：定下来之后那一支不再回改。**id 就是网址那一段**，
#    所以它只能是 URL 里不用转义的字符（tools/versions.py 的 VERSION_RE 拦着），
#    并且**不能长得像数字**（见 tools/navgen.py 的 _quote_numeric_values 与 README）。
#    label 随便取，切换器与页面标题用它，历史版叫「彩蛋」也无所谓。
#
# 现在只有两条：`0101` 是当前版，`egg` 是砍版机制的试用品（一枚彩蛋，
# 里面只有一页谢谢）。要放真正的历史版，按 README 的
# 「加一个版本」加一条，并把当时那棵树整份复制进 content/versions/<id>/；
# 缺的页由 tools/docsgen.py 补跳转桩，不会让人点进 404。



# 页脚品牌区左上角的徽标（可选）。路径相对 docs/。与页眉的 logo 是同一张。
footer_logo = "assets/rwricon.png"

# 社交分享图（可选）。单页可用前置元数据 image: 覆盖；
# 都不给就整组 og:image 不输出，免得指向一张不存在的图。
# og_image = "assets/share.png"

# ── 数据隐私：Zensical 原生的同意表单 ─────────────────────────────────────
# 这个表单的原意是「在向第三方发请求之前征得同意」，勾选项对应的是
# Google Analytics / GitHub 这类 cookie。
#
# ⚠️ 本模版默认**没有任何需要同意的第三方请求**：字体、样式、脚本全部自托管，
# 不设任何 cookie。文案按公告体写：陈述事实，不作排比宣传，不用口语动词。
# 篇幅仍从短——这是人人都会看到的浮层，不是隐私政策的正文位。
# 所以下面**刻意不列任何 cookie 勾选项**——把不存在的东西列进同意表单，
# 才是真正的不诚实。这个表单在这里承担两件事：
#   1. 首次访问时把「本站不收集什么」当面讲清楚；
#   2. 提供 #__consent 这个锚点，让人随时能回到这份说明
#      （页脚链过去）。
# 将来若真的引入统计，再把对应的 cookie 加进 [project.extra.consent.cookies]。
[project.extra.consent]
title = "数据隐私"
description = "本站不收集任何访问数据：无统计、无广告，亦不设置 cookie 或发起任何第三方请求。字体、样式与脚本均由本站自行托管，访问任何页面只连接本站一个域名。浏览器本机仅保存一项深浅色显示偏好，清除浏览器数据后即被移除。"
# 只有一个按钮：这里没有可选项，给「拒绝」按钮是不诚实的。
actions = ["accept"]

# overrides/partials/consent.html 的逻辑是「repo_url 里有 github.com 就自动补一个
# GitHub 勾选项」——那一项管的正是 api.github.com 取 star / fork 的那次请求。
# 本模版默认不要那次请求（理由见文件开头 repo_url 处的注释），故显式关掉：
# 键存在且为 false，consent.html 既不自动补这一项，也不会把它渲染出来。
# 于是同意表单里**一个勾选项都没有**，「不发起任何第三方请求」句句为真。
# 若你启用了 repo_url 并想让读者能用 star 计数，删掉下面这一行即可。
[project.extra.consent.cookies]
github = false

# 同上：config 里的这套文案是全站唯一的，其余语种按 _en / _zh_hant 取用
# （见 overrides/partials/consent.html）。

[[project.extra.version]]
id = "0101"
label = "地编版本 0101"
date = "2026-09-06"
current = true

[[project.extra.version]]
id = "egg"
label = "彩蛋"
date = "2026-05-14"

# 语言代码用**文字**标签（zh-Hans / zh-Hant），不用 zh-CN / zh-TW 这类**地区**标签：
# 地区标签会把用词一起改掉，那是替读者选定某一地的用法。
[[project.extra.alternate]]
name = "简体中文"
link = "./"
lang = "zh-Hans"

[[project.extra.alternate]]
name = "繁體中文"
link = "zh-hant/"
lang = "zh-Hant"

[[project.extra.alternate]]
name = "English"
link = "en/"
lang = "en"


[project.plugins]
awesome-nav = {}
# 图片灯箱：原档与照片页点击放大
glightbox = {}
# 输出压缩
minify = {}

# 搜索。Zensical 只认 enabled / separator 两个选项（没有 lang）。
# 默认分隔符是 [\s\-_,:!=\[\]()\\"`/]+|\.(?!\d) —— 它不切中文标点，
# 于是「社团故事。飞行计划」会变成一个整词，中文检索基本失效。
# 这里在默认集合上补进中文/全角标点，中英混排都能切。
[project.plugins.search]
enabled = true
separator = '[\s\-_,:!=\[\]()\\"`/。，、；：！？…·「」『』（）【】《》〈〉—～]+|\.(?!\d)'

# 标签：给页面打 tags，并在 docs/tags.md 里用 <!-- material/tags --> 汇成一页。
[project.plugins.tags]
enabled = true
listings = true

[project.theme]
custom_dir = "overrides"
# false = 不引 Google Fonts。字体自托管在 assets/fonts/，
# 变量在 stylesheets/fonts.css 里给出（主题在这个分支下不再设置变量）。
font = false
variant = "modern"
# 默认语言的界面文案语言。加语言时这里也要跟着改。
language = "zh"
# 站徽与站点图标。不设就走主题默认（页眉显示一个内置图标，站点图标用主题自带的）。
#
# 两张图是同一次改动加进来的：
#   logo   —— 原始素材 600×300，透明底，直接放 docs/assets/rwricon.png；
#   favicon —— 浏览器只认方形格子，宽图塞进去会被压成一条，所以另存了一份
#              256×256 的方形版（整图按比例缩到 256 宽、上下透明补边，不裁不拉伸）。
#              要换素材时**两张都要重出**，别只换 logo。
logo = "assets/rwricon.png"
favicon = "assets/favicon.png"
# 仓库图标的默认值是通用 git 图标；填了 repo_url 且指向 GitHub 时换成品牌标更好认。
# 图标是构建期内联进 HTML 的 SVG，不产生任何字体或图标请求。
icon.repo = "fontawesome/brands/github"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Material 默认配色：跟随系统，浅色优先，无衬线字体。
# 落地页不另立一套主题，而是直接使用这些变量（见 stylesheets/landing.css）。
#
# 强调色（accent）保持 Material 默认的 indigo，具体色值在
# stylesheets/extra.css 里按色调覆盖，原因见那里的注释。
# 注意：Zensical 的 palette.accent 只认 Material 的**颜色名**，
# 写十六进制会被原样塞进 data-md-color-accent 属性而匹配不到任何规则，
# 反而丢掉强调色。所以这里必须是 "indigo"。
[[project.theme.palette]]
media = "(prefers-color-scheme)"
accent = "indigo"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换深浅色"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色"

# 页面前置元数据里的 status:，会在导航侧栏上显示一枚标签。
# ⚠️ 标识符只能用字母数字、连字符与下划线。
# 这两个都描述「这份材料本身处在什么状态」，而不是它重不重要：
#   draft   —— 还在写，内容不完整
#   partial —— 只写到一半，或只有一句话提及，不是本站漏抄
[project.extra.status]
draft = "草稿"
partial = "未完成"

# 分语种的状态文案。Zensical 的 extra.status 是全站唯一的，
# 与 site_name / copyright 同理，由模板按页面语言取用（见 overrides/partials/nav.html）。
# ⚠️ 必须另起一张表：键名若留在 [project.extra.status] 里，
#    会被当成新的 status 标识符注册进去。
[project.extra.status_label]
draft_en = "Draft"
partial_en = "Incomplete"
draft_zh_hant = "草案"
partial_zh_hant = "殘缺"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
# ⚠️ 标题锚点的生成规则。Zensical 默认那套会把**中日韩字符整段丢掉**：
#    `## Save说明` → `#save`，纯中文标题（本站绝大多数）→ `#_1`、`#_2`……
#    于是目录里的每一条锚点都指不准，toc.permalink 生成的「¶」也就成了摆设。
#    这里换上 pymdownx 的 Unicode 版（`_uslugify`），中日韩字符原样保留：
#    `## 一、地编下载后如何配置` → `#一-地编下载后如何配置`。
#    case 给 lower 是为了让 `Save说明` 与 `save说明` 不分家。
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
pymdownx.betterem = {}
# 图片/表格题注：让「图 + 图说」成为一个 figure，而不是一行裸图。
# 原档与社牌两组图都靠它来带图说（/// caption）。
pymdownx.blocks.caption = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
